<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>物理研究日报</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data/daily.js"></script>
</head>
<body>
  <header class="masthead">
    <a href="index.html" class="wordmark"><span class="mark">φ</span> Physics <b>Daily</b></a>
    <div class="header-right"><span class="status-dot"></span><span>每日论文聚合</span><span class="divider">/</span><span id="updated-at">等待数据</span></div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-overline">PERSONAL DAILY PAPER DIGEST</div>
      <h1>📰 物理研究日报</h1>
      <p id="issue-date" class="issue-date">每日更新 · 聚焦你的研究主题</p>
      <p class="hero-sub">收录 arXiv 预印本与期刊论文 · 每天北京时间 00:00 定时更新</p>
    </section>

    <div id="data-warning" class="data-warning" hidden></div>
    <section class="topic-grid" id="topic-grid" aria-label="所选批次的六个主题"></section>

    <section class="batch-panel">
      <div class="panel-heading"><div><span class="mini-icon">▦</span><h2>最近批次</h2><span class="panel-hint">滚动保留近 30 天</span></div><span class="batch-total" id="batch-total"></span></div>
      <div id="batch-list" class="batch-list"></div>
    </section>

    <section class="papers-panel" id="papers-panel">
      <div class="papers-heading"><div><p class="eyebrow" id="papers-eyebrow">LATEST ISSUE</p><h2 id="papers-title">今日相关论文</h2></div><div class="paper-controls"><label class="filter-input"><span aria-hidden="true">⌕</span><input id="paper-filter" type="search" aria-label="搜索标题、作者、摘要或刊名" placeholder="标题、作者、摘要或刊名"></label>
        <select id="source-filter" aria-label="按来源筛选"><option value="all">全部来源</option><option id="arxiv-count" value="arxiv">arXiv 预印本</option><option id="journal-count" value="journal">期刊论文</option></select><select id="topic-filter" aria-label="按主题筛选"><option value="all">全部主题</option></select></div></div>
      <div id="paper-list" class="paper-list"></div>
    </section>
    <footer><span>★ 同行评审：已核验；未标星表示未核验。</span><span>论文来源：arXiv 与期刊（Nature / Nature Physics、Science、Physical Review 等）</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
