<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>arXiv 今日论文速览</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data/daily.js"></script>
</head>
<body>
  <header class="masthead">
    <a href="index.html" class="wordmark"><span class="mark">a</span> arXiv <b>Daily</b></a>
    <div class="header-right"><span class="status-dot"></span><span>每日论文聚合</span><span class="divider">/</span><span id="updated-at">等待数据</span></div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-overline">PERSONAL DAILY PAPER DIGEST</div>
      <h1>📰 arXiv 今日论文速览</h1>
      <p id="issue-date" class="issue-date">每日更新 · 聚焦你的研究主题</p>
      <p class="hero-sub">从最新预印本中筛出与你相关的论文，按主题和日期集中浏览。</p>
    </section>

    <div id="data-warning" class="data-warning" hidden></div>
    <section class="topic-grid" id="topic-grid" aria-label="今日主题论文"></section>

    <section class="batch-panel">
      <div class="panel-heading"><div><span class="mini-icon">▦</span><h2>最近批次</h2><span class="panel-hint">滚动保留近 30 天</span></div><span class="batch-total" id="batch-total"></span></div>
      <div id="batch-list" class="batch-list"></div>
    </section>

    <section class="papers-panel" id="papers-panel">
      <div class="papers-heading"><div><p class="eyebrow" id="papers-eyebrow">LATEST ISSUE</p><h2 id="papers-title">今日相关论文</h2></div><div class="paper-controls"><label class="filter-input"><span>⌕</span><input id="paper-filter" type="search" placeholder="筛标题、作者或摘要"></label><select id="topic-filter" aria-label="按主题筛选"><option value="all">全部主题</option><option value="sensing">量子精密测量</option><option value="dark">暗物质探测</option><option value="foundations">量子力学基础问题</option></select></div></div>
      <div id="paper-list" class="paper-list"></div>
    </section>
    <footer><span>PERSONAL ARXIV DIGEST · 由 arXiv Atom API 更新</span><span>论文元数据来源 <a href="https://arxiv.org" target="_blank" rel="noreferrer">arXiv.org</a></span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
